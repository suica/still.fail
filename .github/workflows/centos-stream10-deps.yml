name: CentOS Stream 10 desktop packages
on:
  push:
    branches: [ci/centos-stream10-desktop-20261103]
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Verify desktop runtime packages and components
        run: |
          docker run --rm quay.io/centos/centos:stream10 bash -euxc '
            dnf -q repolist
            for package in gnome-shell xorg-x11-server-Xwayland python3-gobject gtk3 pipewire pipewire-gstreamer gstreamer1 gstreamer1-plugins-base gstreamer1-plugins-good xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk wireplumber dbus-daemon mesa-dri-drivers at-spi2-core at-spi2-atk libX11 libXtst ffmpeg xdotool; do
              printf "PACKAGE %s\n" "$package"
              dnf -q repoquery --available --qf "%{name} %{repoid}" "$package" | sort -u
            done
            dnf -y install python3-gobject gtk3 pipewire pipewire-gstreamer gstreamer1-plugins-base gstreamer1-plugins-good xdg-desktop-portal xdg-desktop-portal-gnome xdg-desktop-portal-gtk wireplumber at-spi2-core at-spi2-atk libX11 libXtst
            /usr/bin/python3 -c "import ctypes.util, gi; gi.require_version(\"Gst\", \"1.0\"); gi.require_version(\"Atspi\", \"2.0\"); gi.require_version(\"Gdk\", \"3.0\"); from gi.repository import Gst, Atspi, Gdk; Gst.init(None); names=(\"pipewiresrc\",\"ximagesrc\",\"queue\",\"identity\",\"videoconvert\",\"videoscale\",\"jpegenc\",\"appsink\"); missing=[n for n in names if not Gst.ElementFactory.find(n)]; print(\"Missing GStreamer components:\",missing,\"XTest:\",ctypes.util.find_library(\"Xtst\")); assert not missing and ctypes.util.find_library(\"Xtst\")"
          '
