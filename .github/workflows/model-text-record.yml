name: Model text recording
on:
  push:
    branches: [media/model-textrec-debug-20261122]
permissions:
  contents: read
jobs:
  record:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Set up the Farview stand-in
        shell: bash
        run: |
          mkdir -p apps/mbui/deps/farview/client
          cp -a evidence-fvclient/. apps/mbui/deps/farview/client/
          cp apps/mbui/farview.pin apps/mbui/deps/farview/.pin
      - name: Record model screen text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/mbui/scripts/screens.sh')
          s = p.read_text()
          assert 'APP=sffix MODE=release' in s
          assert '_build/native/release/build/stillfail/sffix' in s
          s = s.replace('APP=sffix MODE=release', 'APP=sffix MODE=debug')
          s = s.replace('_build/native/release/build/stillfail/sffix', '_build/native/debug/build/stillfail/sffix')
          p.write_text(s)
          PY
          bash apps/mbui/scripts/screens.sh rec newchat-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-text-record
          path: |
            apps/mbui/screens/text-mac.textrec
            apps/mbui/out/screens/newchat-model.log
          retention-days: 7
