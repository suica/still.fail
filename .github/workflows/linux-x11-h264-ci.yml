name: Linux X11 H264 verification
on:
  push:
    branches: [ci/linux-x11-h264-v1]
permissions:
  contents: read
jobs:
  x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install test tools and station dependencies
        run: |
          npm install --global pnpm@10.33.0
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xdotool xvfb xauth x11-utils x11-xkb-utils x11-xserver-utils
          pnpm --dir station install --frozen-lockfile
      - name: Compare Xvfb reset behavior
        working-directory: station
        run: |
          export XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          echo 'Normal Xvfb'
          xvfb-run -a -s '-screen 0 1280x800x24' node side/x11-reset-diagnostic.ts
          echo 'A persistent desktop client'
          KEEP_X_CLIENT=1 xvfb-run -a -s '-screen 0 1280x800x24' node side/x11-reset-diagnostic.ts
          echo 'Xvfb with resets disabled'
          xvfb-run -a -s '-screen 0 1280x800x24 -noreset' node side/x11-reset-diagnostic.ts
      - name: Typecheck and screen regression tests
        working-directory: station
        run: |
          pnpm check
          node --import ./test/setup-env.mjs --test test/screens.test.ts test/platform.test.ts test/computer.test.ts
      - name: Repeat X11 lifecycle regression
        working-directory: station
        run: |
          export STILLFAIL_TEST_X11=1 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          for round in $(seq 1 10); do
            echo "Lifecycle round $round"
            xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test test/x11-desktop-lifecycle.test.ts
          done
      - name: Linux X11 capture and input
        run: |
          export STILLFAIL_TEST_X11=1 STILLFAIL_TEST_X11_REAL_MESH=1 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          cd station
          for test in test/x11-desktop.test.ts test/x11-desktop-real.test.ts test/x11-h264.test.ts test/x11-desktop-lifecycle.test.ts; do
            node ../scripts/native.ts run mesh -- xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test "$test"
          done
          STILLFAIL_TEST_X11_BROWSER=1 node ../scripts/native.ts run mesh -- xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test test/x11-h264-browser.test.ts
