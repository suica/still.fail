name: iOS bar haptics verification
on:
  push:
    branches: [codex/ios-haptics-ci-c8e46cf1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [app, replay]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          export PATH="$MOON_HOME/bin:$PATH"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          moon version --all
      - name: Native app tests
        shell: bash
        env:
          PARTS: ${{ matrix.part }}
          TARGETS: native
          MBC_REAL_CC: clang
          SFAPP_SHARDS: 4
          LINES_OUT: 80
        run: bash apps/mbui/scripts/test.sh
      - name: App static checks
        if: matrix.part == 'replay'
        run: bash apps/mbui/scripts/check.sh
