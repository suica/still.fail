name: Model multiselect Linux verification
on:
  push:
    branches: [verify-model-linux]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          export PATH="$MOON_HOME/bin:$PATH"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Check app
        run: TARGETS='native js' bash apps/mbui/scripts/check.sh
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          export PATH="$MOON_HOME/bin:$PATH"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Test app
        run: PARTS=app SFAPP_SHARDS=2 bash apps/mbui/scripts/test.sh
      - name: Test screens
        run: bash apps/mbui/scripts/screens.sh test
