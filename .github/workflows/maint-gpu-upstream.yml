name: GPU host sampling maintenance validation
on:
  push:
    branches: [ci/maintain-3437-upstream-20261103]
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@10.33.0
      - run: pnpm --dir station install --frozen-lockfile
      - run: pnpm --dir station check
      - name: Host and GPU regression tests
        working-directory: station
        run: node --import ./test/setup-env.mjs --test --test-force-exit test/load.test.ts test/linux-gpu.test.ts
