name: text-card-verification
on:
  push:
    branches: [ci/text-card-20261103]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 83ef3f415ee2b110d0c9084f6be8bf73b5daac84
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install MoonBit
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check the app
        run: bash apps/mbui/scripts/check.sh
      - name: Test text cards
        shell: bash
        run: |
          set -e
          cd apps/mbui
          . scripts/env.sh
          ulimit -s 65536
          native_tests "$PWD"
          export MBC_JOBS=2
          export MBC_REAL_CC=clang
          moon test $NATIVE -p stillfail/sfapp --file cards_wbtest.mbt

