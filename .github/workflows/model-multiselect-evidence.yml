name: Model selection comparison
on:
  push:
    branches: [verify-model-evidence]
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install MoonBit and browser
        shell: bash
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          export PATH="$MOON_HOME/bin:$PATH"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          npm install --prefix "$RUNNER_TEMP/visual" playwright
          "$RUNNER_TEMP/visual/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_PACKAGE=$RUNNER_TEMP/visual/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Capture before the fix
        shell: bash
        run: |
          mkdir -p evidence
          git show 'HEAD^^:apps/mbui/src/sfpages/accounts.mbt' > apps/mbui/src/sfpages/accounts.mbt
          APP=sffix bash apps/mbui/scripts/web.sh build
          node .github/model-evidence.cjs evidence/before.png
      - name: Capture after the fix
        shell: bash
        run: |
          git show 'HEAD^:apps/mbui/src/sfpages/accounts.mbt' > apps/mbui/src/sfpages/accounts.mbt
          APP=sffix bash apps/mbui/scripts/web.sh build
          node .github/model-evidence.cjs evidence/after.png
      - uses: actions/upload-artifact@v4
        with:
          name: model-selection-before-after
          path: evidence/*.png
