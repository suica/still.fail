name: History reminder evidence
on:
  push:
    branches: [ci/history-reminder-evidence-20261102]
permissions:
  contents: read
jobs:
  native-check:
    if: ${{ !startsWith(github.event.head_commit.message, 'Pictures:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - run: bash apps/mbui/scripts/check.sh
  native-tests:
    if: ${{ !startsWith(github.event.head_commit.message, 'Pictures:') }}
    name: native (${{ matrix.part }} ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: app, group: pkgs }
          - { part: replay, group: '' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Package tests on native
        run: TIMES=1 PARTS='${{ matrix.part }}' APP_GROUP='${{ matrix.group }}' SFAPP_SHARDS=4 bash apps/mbui/scripts/test.sh
  native-app-build:
    if: ${{ !startsWith(github.event.head_commit.message, 'Pictures:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Build the app's test program
        run: TIMES=1 PARTS=app APP_GROUP=1/4 APP_BUILD_OUT="$RUNNER_TEMP/app-test" SFAPP_SHARDS=4 bash apps/mbui/scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: reminder-app-test
          path: ${{ runner.temp }}/app-test
  native-app:
    if: ${{ !startsWith(github.event.head_commit.message, 'Pictures:') }}
    needs: native-app-build
    name: native (app ${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4, contrast]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: reminder-app-test
          path: ${{ runner.temp }}/app-test
      - name: Run this app test group
        run: |
          chmod +x "$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" "$RUNNER_TEMP/app-test/testexe"
          TESTEXE="$RUNNER_TEMP/app-test/testexe" APP_EXE="$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" \
            APP_INFO="$RUNNER_TEMP/app-test/__whitebox_test_info.json" TIMES=1 PARTS=app \
            APP_GROUP='${{ matrix.group }}' SFAPP_SHARDS=4 bash apps/mbui/scripts/test.sh
  screenshots:
    if: ${{ !startsWith(github.event.head_commit.message, 'Native:') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 20
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install MoonBit and Playwright
        run: |
          export MOON_HOME="$RUNNER_TEMP/moon"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moon-install.sh"
          bash "$RUNNER_TEMP/moon-install.sh"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          npm install --prefix .github/reminder-evidence --no-audit --no-fund playwright-core@1.63.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture before and after from the app's web host
        run: |
          set -euo pipefail
          node .github/reminder-evidence/fixture.mjs
          git show b6915572d:apps/mbui/src/sfpages/history_steps.mbt > apps/mbui/src/sfpages/history_steps.mbt
          cd apps/mbui
          moon build --target js --release src/sffix
          mkdir -p out/web
          cp _build/js/release/build/stillfail/sffix/sffix.js out/web/demo.js
          cp mbui/web/index.html mbui/web/host.js out/web/
          cd ../..
          node .github/reminder-evidence/capture.mjs before.png
          git show HEAD:apps/mbui/src/sfpages/history_steps.mbt > apps/mbui/src/sfpages/history_steps.mbt
          cd apps/mbui
          moon build --target js --release src/sffix
          cp _build/js/release/build/stillfail/sffix/sffix.js out/web/demo.js
          cd ../..
          node .github/reminder-evidence/capture.mjs after.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: history-reminder-pictures
          path: |
            before.png
            after.png
            before-detail.png
            after-detail.png
            diagnostic.png
          if-no-files-found: warn
