name: appearance-title-validation
on:
  push:
    branches: [ci/appearance-title-20261102]
permissions:
  contents: read
jobs:
  moonbit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install MoonBit as the repository's MoonBit workflow does
        env:
          MOON_HOME: ${{ runner.tool_cache }}/moon-ci
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/install/unix.sh | bash
          "$MOON_HOME/bin/moon" version --all
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.tool_cache }}/moon-ci
          key: moonbit-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-appearance-${{ github.sha }}
  check-mbui:
    needs: moonbit
    uses: ./.github/workflows/mbui-check.yml
