name: agent sheet alignment verification
on:
  push:
    branches: [ci/agent-sheet-alignment-check]
permissions:
  contents: read
jobs:
  app-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check the app
        run: bash apps/mbui/scripts/check.sh
      - name: Build the app test program
        run: TARGETS=native PARTS=app APP_GROUP=1/4 APP_BUILD_OUT="$RUNNER_TEMP/app-test" bash apps/mbui/scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: app-test
          path: ${{ runner.temp }}/app-test/
      - name: Check agent sheet interactions and alignment
        working-directory: apps/mbui
        run: |
          . scripts/env.sh
          if moon_test_native -p stillfail/sfapp --file station_peek_wbtest.mbt > "$RUNNER_TEMP/agent-test.log" 2>&1; then
            tail -4 "$RUNNER_TEMP/agent-test.log"
          else
            tail -80 "$RUNNER_TEMP/agent-test.log"
            exit 1
          fi
      - name: Check the screens
        run: bash apps/mbui/scripts/screens.sh test
  app:
    name: app-${{ matrix.group }}
    needs: app-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [1/4, 2/4, 3/4, 4/4, contrast]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: app-test
          path: ${{ runner.temp }}/app-test/
      - name: Run the app tests
        run: |
          chmod +x "$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" "$RUNNER_TEMP/app-test/testexe"
          TESTEXE="$RUNNER_TEMP/app-test/testexe" APP_EXE="$RUNNER_TEMP/app-test/sfapp.whitebox_test.exe" \
            APP_INFO="$RUNNER_TEMP/app-test/__whitebox_test_info.json" TARGETS=native PARTS=app \
            APP_GROUP=${{ matrix.group }} SFAPP_SHARDS=4 bash apps/mbui/scripts/test.sh
  other:
    name: other-${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: app, group: pkgs }
          - { part: replay, group: '' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install MoonBit
        run: |
          curl -fsSL --retry 3 https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Run the other tests
        run: TARGETS=native PARTS=${{ matrix.part }} APP_GROUP=${{ matrix.group }} bash apps/mbui/scripts/test.sh
