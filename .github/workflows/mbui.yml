name: screen-latency-targeted-verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MOON_HOME: ${{ github.workspace }}/.ci-moon-lowlatency
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v5
        with:
          ref: 62587078d7bb0a942d513352cc09cdae45782f3f
          path: target
          persist-credentials: false
      - name: Check out synthetic Farview fixture
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: harness
          sparse-checkout: ci-test-fixtures/farview
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Verify exact source revision and web playback
        working-directory: target
        run: |
          test "$(git rev-parse HEAD)" = 62587078d7bb0a942d513352cc09cdae45782f3f
          node --test libs/mbui/test/web/stream-pace.test.mjs
      - name: Install the official MoonBit release for this isolated runner
        run: |
          mkdir -p "$MOON_HOME/lib"
          curl -fsSL --retry 3 https://cli.moonbitlang.com/binaries/latest/moonbit-linux-x86_64.tar.gz -o "$RUNNER_TEMP/moon-bin.tar.gz"
          curl -fsSL --retry 3 https://cli.moonbitlang.com/cores/core-latest.tar.gz -o "$RUNNER_TEMP/moon-core.tar.gz"
          tar -xzf "$RUNNER_TEMP/moon-bin.tar.gz" -C "$MOON_HOME"
          tar -xzf "$RUNNER_TEMP/moon-core.tar.gz" -C "$MOON_HOME/lib"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          "$MOON_HOME/bin/moon" version --all
          PATH="$MOON_HOME/bin:$PATH" "$MOON_HOME/bin/moon" -C "$MOON_HOME/lib/core" bundle --warn-list -a --target wasm-gc --quiet
      - name: MoonBit stream tests
        working-directory: target/libs/mbui
        run: moon test --target wasm-gc --release src/ui/stream_wbtest.mbt
      - name: Screen control tests with synthetic Farview dependency
        run: |
          mkdir -p target/apps/mbui/deps/farview
          cp -R harness/ci-test-fixtures/farview/client target/apps/mbui/deps/farview/client
          mv target/apps/mbui/src/sfpages/farview_tab_wbtest.mbt "$RUNNER_TEMP/farview_tab_wbtest.mbt"
          cd target/apps/mbui
          moon test --target wasm-gc --release src/sfpages/screen_panel_wbtest.mbt
