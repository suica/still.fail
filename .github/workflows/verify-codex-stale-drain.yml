name: Verify Codex stale app-server drain
on:
  push:
    branches: [ci/codex-stale-host-drain]
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install station dependencies
        run: cd station && pnpm install --frozen-lockfile
      - name: Check station types
        run: cd station && pnpm check
      - name: Test the Codex driver
        run: |
          cd station
          node ../scripts/native.ts run mesh runner -- node --import ./test/setup-env.mjs --test --test-concurrency=2 --test-timeout=600000 test/codex.test.ts test/codex-here.test.ts
