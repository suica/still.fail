name: Maintain Linux desktop PR
on:
  push:
    branches: [ci/maintain-3589-20261103]
permissions:
  contents: read
jobs:
  linux-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: .node-version, package-manager-cache: false }
      - run: npm install -g pnpm@10.33.0
      - name: Install isolated desktop test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xdotool xvfb xauth x11-utils x11-xkb-utils x11-xserver-utils python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6
      - run: pnpm --dir station install --frozen-lockfile
      - name: Station typecheck and clock guard
        run: |
          pnpm --dir station check
          ! git grep -nE 'Date\.now\(|new Date\(\)|setTimeout\(|setInterval\(' -- station/src ':!station/src/ops/fibers.ts' ':!station/src/agents/cursor-bridge.mjs' ':!station/src/agents/sandbox-bridge.mjs'
      - name: Desktop session and portal regressions
        working-directory: station
        run: |
          node --import ./test/setup-env.mjs --test test/linux-portal.test.ts test/linux-screen-tools.test.ts
          /usr/bin/python3 test/linux-portal-text.py
          /usr/bin/python3 test/linux-portal-frames.py
          xvfb-run -a -s '-screen 0 800x600x24' /usr/bin/python3 test/linux-x11-gstreamer.py
      - name: X11 desktop screen protocol
        working-directory: station
        run: |
          unset WAYLAND_DISPLAY
          xvfb-run -a -s '-screen 0 1280x800x24' env STILLFAIL_TEST_X11=1 XDG_SESSION_TYPE=x11 node --import ./test/setup-env.mjs --test test/x11-desktop.test.ts
