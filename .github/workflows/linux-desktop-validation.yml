name: Linux screen tools validation
on:
  push:
    branches: [ci/linux-desktop-integrated-tools]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  station:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24.22.1', package-manager-cache: false }
      - run: npm install -g pnpm@10.33.0
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg xdotool xvfb xauth python3-gi gir1.2-gtk-3.0 gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good libxtst6
      - run: pnpm --dir station install --frozen-lockfile
      - run: pnpm --dir station check
      - name: Private preparation and retry tests
        working-directory: station
        run: node --import ./test/setup-env.mjs --test --test-timeout=60000 test/linux-screen-tools.test.ts test/x11-desktop.test.ts test/linux-portal.test.ts test/screens.test.ts
      - name: Wayland committed text and keyboard locks
        working-directory: station
        run: /usr/bin/python3 test/linux-portal-text.py
      - name: Deliver the final damage frame
        working-directory: station
        run: /usr/bin/python3 test/linux-portal-frames.py
      - name: GStreamer X11 capture, input and Unicode
        working-directory: station
        run: xvfb-run -a -s '-screen 0 800x600x24' /usr/bin/python3 test/linux-x11-gstreamer.py
      - name: Real APT pair on an isolated X11 desktop
        working-directory: station
        run: |
          export STILLFAIL_TEST_X11_APT=1 XDG_SESSION_TYPE=x11
          unset WAYLAND_DISPLAY
          xvfb-run -a -s '-screen 0 1280x800x24' node --import ./test/setup-env.mjs --test --test-name-pattern='private APT pair' test/linux-screen-tools.test.ts
      - name: Build and verify packaged helpers
        run: |
          pnpm --dir station build
          test -s station/dist/linux-portal.py
          test -s station/dist/linux-x11.py
          node --check station/dist/main.js
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: app, group: pkgs}
          - {part: app, group: '1/4'}
          - {part: app, group: '2/4'}
          - {part: app, group: '3/4'}
          - {part: app, group: '4/4'}
          - {part: app, group: contrast}
          - {part: replay, group: ''}
    env:
      TARGETS: native
      MBC_REAL_CC: clang
      SFAPP_SHARDS: '4'
      PARTS: ${{ matrix.part }}
      APP_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '24.22.1', package-manager-cache: false }
      - name: Install MoonBit in the runner's temporary directory
        shell: bash
        run: |
          set -euo pipefail
          export MOON_HOME="$RUNNER_TEMP/moon"
          mkdir -p "$MOON_HOME/lib"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/binaries/latest/moonbit-linux-x86_64.tar.gz | tar -xz -C "$MOON_HOME"
          curl -fsSL --retry 3 --retry-all-errors https://cli.moonbitlang.com/cores/core-latest.tar.gz | tar -xz -C "$MOON_HOME/lib"
          ln -sf moon "$MOON_HOME/bin/moonx"
          chmod +x "$MOON_HOME"/bin/* "$MOON_HOME"/bin/internal/tcc
          export PATH="$MOON_HOME/bin:$PATH"
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --all
          moon -C "$MOON_HOME/lib/core" bundle --warn-list -a --target wasm-gc --quiet
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
      - name: App checks
        if: matrix.part == 'replay'
        run: bash apps/mbui/scripts/check.sh
      - name: App tests
        shell: bash
        run: |
          trap 'cat /sys/fs/cgroup/memory.events 2>/dev/null || true; free -h || true' EXIT
          TIMES=1 bash apps/mbui/scripts/test.sh
      - name: Screen tests
        if: matrix.group == 'pkgs'
        run: bash apps/mbui/scripts/screens.sh test
